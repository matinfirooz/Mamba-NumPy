<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="795" viewBox="0 0 1050 795" role="img" aria-label="Mamba-1 block architecture and recurrent state shapes"><title>Mamba-1 block architecture and recurrent state shapes</title><rect width="100%" height="100%" fill="#09151f"/><g font-family="Inter, DejaVu Sans, Arial, sans-serif"><text x="40" y="43" fill="#edf7fa" font-size="26" text-anchor="start" font-weight="650">Inside one Mamba residual block</text><text x="40" y="71" fill="#a6bbc9" font-size="15" text-anchor="start" font-weight="400">E = expand × d_model     N = d_state     R = dt_rank</text><rect x="340" y="95" width="400" height="64" rx="14" fill="#102332" stroke="#75bfff"/><text x="540.0" y="124" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">RMSNorm → input projection</text><text x="540.0" y="148" fill="#a6bbc9" font-size="13" text-anchor="middle" font-weight="400">(batch, time, d_model) → 2E</text><line x1="450" y1="159" x2="280" y2="198" stroke="#75bfff" stroke-width="2" stroke-dasharray=""/><circle cx="280" cy="198" r="3" fill="#75bfff"/><line x1="650" y1="159" x2="850" y2="198" stroke="#54e2be" stroke-width="2" stroke-dasharray=""/><circle cx="850" cy="198" r="3" fill="#54e2be"/><rect x="90" y="198" width="390" height="72" rx="14" fill="#102332" stroke="#75bfff"/><text x="285.0" y="227" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">Causal depthwise convolution</text><text x="285.0" y="251" fill="#a6bbc9" font-size="13" text-anchor="middle" font-weight="400">left-padded K taps → SiLU → u</text><rect x="735" y="198" width="235" height="72" rx="14" fill="#102332" stroke="#54e2be"/><text x="852.5" y="227" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">Gate branch</text><text x="852.5" y="251" fill="#a6bbc9" font-size="13" text-anchor="middle" font-weight="400">SiLU(z)</text><line x1="280" y1="270" x2="280" y2="300" stroke="#75bfff" stroke-width="2" stroke-dasharray=""/><circle cx="280" cy="300" r="3" fill="#75bfff"/><rect x="90" y="300" width="390" height="75" rx="14" fill="#102332" stroke="#75bfff"/><text x="285.0" y="329" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">Input-dependent projections</text><text x="285.0" y="353" fill="#a6bbc9" font-size="13" text-anchor="middle" font-weight="400">u → low-rank Δ, Bₜ, Cₜ</text><line x1="280" y1="375" x2="280" y2="413" stroke="#75bfff" stroke-width="2" stroke-dasharray=""/><circle cx="280" cy="413" r="3" fill="#75bfff"/><rect x="65" y="413" width="490" height="104" rx="14" fill="#102332" stroke="#ffca7d"/><text x="310.0" y="442" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">Selective state-space recurrence</text><text x="310.0" y="466" fill="#a6bbc9" font-size="13" text-anchor="middle" font-weight="400">hₜ = exp(Δₜ A) ⊙ hₜ₋₁ + Δₜ Bₜ uₜ</text><text x="310" y="494" fill="#edf7fa" font-size="16" text-anchor="middle" font-weight="400">yₜ = Σ Cₜ hₜ + D ⊙ uₜ</text><rect x="625" y="338" width="345" height="77" rx="14" fill="#102332" stroke="#ffca7d"/><text x="797.5" y="367" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">Persistent recurrent state</text><text x="797.5" y="391" fill="#a6bbc9" font-size="13" text-anchor="middle" font-weight="400">SSM: (B,E,N)  ·  conv: (B,K−1,E)</text><line x1="625" y1="382" x2="555" y2="450" stroke="#ffca7d" stroke-width="2" stroke-dasharray=""/><circle cx="555" cy="450" r="3" fill="#ffca7d"/><line x1="852" y1="270" x2="1000" y2="270" stroke="#54e2be" stroke-width="2" stroke-dasharray=""/><line x1="1000" y1="270" x2="1000" y2="555" stroke="#54e2be" stroke-width="2" stroke-dasharray=""/><line x1="310" y1="517" x2="310" y2="555" stroke="#75bfff" stroke-width="2" stroke-dasharray=""/><line x1="310" y1="555" x2="520" y2="555" stroke="#75bfff" stroke-width="2" stroke-dasharray=""/><line x1="1000" y1="555" x2="580" y2="555" stroke="#54e2be" stroke-width="2" stroke-dasharray=""/><rect x="520" y="533" width="60" height="47" rx="14" fill="#102332" stroke="#54e2be"/><text x="550.0" y="562" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">×</text><line x1="550" y1="580" x2="550" y2="610" stroke="#75bfff" stroke-width="2" stroke-dasharray=""/><circle cx="550" cy="610" r="3" fill="#75bfff"/><rect x="335" y="610" width="430" height="75" rx="14" fill="#102332" stroke="#75bfff"/><text x="550.0" y="639" fill="#edf7fa" font-size="18" text-anchor="middle" font-weight="650">Output projection + residual</text><text x="550.0" y="663" fill="#a6bbc9" font-size="13" text-anchor="middle" font-weight="400">E → d_model; add the block input</text><text x="40" y="733" fill="#edf7fa" font-size="18" text-anchor="start" font-weight="400">Stack blocks → final RMSNorm → tied vocabulary head → next-token logits</text><text x="40" y="765" fill="#a6bbc9" font-size="14" text-anchor="start" font-weight="400">All projections, normalization, state updates, gradients, and optimization run in NumPy.</text></g></svg>