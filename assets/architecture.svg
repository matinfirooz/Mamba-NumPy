<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526b82"/></marker></defs><rect width="1200" height="1060" fill="#f5f8fc"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="60" y="58" font-size="34" fill="#172e46" text-anchor="start">Mamba-1</text><text x="60" y="89" font-size="20" fill="#536c82" text-anchor="start">Selective state-space residual block</text><text x="1140" y="55" font-size="13" fill="#307a79" text-anchor="end">NUMPY IMPLEMENTATION</text><rect x="390" y="120" width="420" height="65" rx="12" fill="#ffffff" stroke="#bed0e1" stroke-width="1.5"/><text x="600.0" y="150" font-size="19" fill="#172e46" text-anchor="middle">Block input x</text><text x="600.0" y="175" font-size="14" fill="#536c82" text-anchor="middle">B × L × D</text><path d="M600 185V215" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="215" width="420" height="70" rx="12" fill="#ffffff" stroke="#bed0e1" stroke-width="1.5"/><text x="600.0" y="245" font-size="19" fill="#172e46" text-anchor="middle">RMSNorm → Linear</text><text x="600.0" y="270" font-size="14" fill="#536c82" text-anchor="middle">D → 2E; split into u branch and z branch</text><path d="M490 285V315H300V340" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><path d="M710 285V315H910V340" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="340" width="400" height="75" rx="12" fill="#eaf3ff" stroke="#83acd9" stroke-width="1.5"/><text x="300.0" y="370" font-size="19" fill="#172e46" text-anchor="middle">Causal depthwise convolution</text><text x="300.0" y="395" font-size="14" fill="#536c82" text-anchor="middle">K taps · left padding · SiLU</text><rect x="790" y="340" width="240" height="75" rx="12" fill="#e7f6f1" stroke="#7fbaaa" stroke-width="1.5"/><text x="910.0" y="370" font-size="19" fill="#172e46" text-anchor="middle">SiLU gate</text><text x="910.0" y="395" font-size="14" fill="#536c82" text-anchor="middle">g = SiLU(z)</text><path d="M300 415V450" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="450" width="400" height="80" rx="12" fill="#eaf3ff" stroke="#83acd9" stroke-width="1.5"/><text x="300.0" y="480" font-size="19" fill="#172e46" text-anchor="middle">Input-dependent projections</text><text x="300.0" y="505" font-size="14" fill="#536c82" text-anchor="middle">u → r, Bₜ, Cₜ   ·   Δₜ = softplus(rWΔ + bΔ)</text><rect x="680" y="465" width="350" height="65" rx="12" fill="#ffffff" stroke="#bed0e1" stroke-width="1.5"/><text x="855.0" y="495" font-size="19" fill="#172e46" text-anchor="middle">Learned state coefficients</text><text x="855.0" y="520" font-size="14" fill="#536c82" text-anchor="middle">A = −exp(A_log)   ·   skip scale Dₛ</text><path d="M300 530V575" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><path d="M680 500H575V600H540" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="575" width="440" height="150" rx="12" fill="#fff4df" stroke="#d6ad60" stroke-width="1.5"/><text x="320.0" y="605" font-size="19" fill="#172e46" text-anchor="middle">Selective state update</text><text x="320" y="643" font-size="17" fill="#172e46" text-anchor="middle">hₜ = exp(Δₜ A) ⊙ hₜ₋₁ + Δₜ Bₜ uₜ</text><text x="320" y="681" font-size="17" fill="#172e46" text-anchor="middle">yₜ = Σₙ Cₜ,ₙ hₜ,ₙ + Dₛ ⊙ uₜ</text><rect x="680" y="585" width="350" height="110" rx="12" fill="#fff9ec" stroke="#d6ad60" stroke-width="1.5"/><text x="855.0" y="615" font-size="19" fill="#172e46" text-anchor="middle">Recurrent memory</text><text x="855.0" y="640" font-size="14" fill="#536c82" text-anchor="middle">SSM: B × E × N</text><text x="855" y="670" font-size="14" fill="#536c82" text-anchor="middle">Conv history: B × (K − 1) × E</text><path d="M680 620H540" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 5"/><path d="M100 380H65V700H100" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><text x="72" y="552" font-size="16" fill="#172e46" text-anchor="middle">u</text><path d="M320 725V775H560" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><path d="M910 415H1060V775H620" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><circle cx="590" cy="775" r="29" fill="#e7f6f1" stroke="#7fbaaa" stroke-width="2"/><text x="590" y="783" font-size="28" fill="#172e46" text-anchor="middle">×</text><path d="M590 804V835" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="835" width="400" height="65" rx="12" fill="#ffffff" stroke="#bed0e1" stroke-width="1.5"/><text x="590.0" y="865" font-size="19" fill="#172e46" text-anchor="middle">Output projection</text><text x="590.0" y="890" font-size="14" fill="#536c82" text-anchor="middle">E → D</text><path d="M600 900V931" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><path d="M810 152H1110V956H629" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><circle cx="600" cy="956" r="25" fill="white" stroke="#bed0e1" stroke-width="2"/><text x="600" y="964" font-size="27" fill="#172e46" text-anchor="middle">+</text><text x="1085" y="923" font-size="15" fill="#536c82" text-anchor="end">Residual</text><path d="M600 981V1010" fill="none" stroke="#526b82" stroke-width="2" marker-end="url(#a)"/><text x="600" y="1040" font-size="19" fill="#172e46" text-anchor="middle">Block output  ·  B × L × D</text><text x="60" y="1010" font-size="14" fill="#536c82" text-anchor="start">E = expand × D</text><text x="60" y="1035" font-size="13" fill="#536c82" text-anchor="start">N = state size · K = convolution width</text></g></svg>